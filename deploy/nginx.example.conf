# OPTIONAL TEMPLATE ONLY. No institution server/domain/certificate is confirmed.
# Replace paths and hostname after the deployment environment is agreed.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
upstream rideshare_backend {
    server 127.0.0.1:3000;
    # Add other confirmed workers only with shared Redis enabled on all workers.
}
server {
    listen 443 ssl;
    server_name example.invalid;
    ssl_certificate /path/to/confirmed/fullchain.pem;
    ssl_certificate_key /path/to/confirmed/private-key.pem;
    root /path/to/ride_frontend/dist;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location /api/auth/ {
        proxy_pass http://rideshare_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /backend/ {
        proxy_pass http://rideshare_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
